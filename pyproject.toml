[project]
name = "custom-slm"
version = "0.1.0"
description = "Local specialist SLM factory — distill, fine-tune, and serve a farm of niche coding models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
train = [
    "unsloth",
    "datasets",
]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
custom-slm = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["catalog/*.yaml"]
